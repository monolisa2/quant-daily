name: Daily Quant Brief

on:
  schedule:
    # GitHub 크론은 부하에 따라 3~6시간까지 지연된다.
    # 아침 7시 전에 끝나도록 시도 시각을 앞당기고 3번 걸어둔다.
    - cron: '37 13 * * 0-4'   # KST 22:37
    - cron: '41 15 * * 0-4'   # KST 00:41
    - cron: '43 17 * * 0-4'   # KST 02:43
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: quant-daily
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate report
        run: node run.mjs

      - name: Commit and push
        run: |
          git config user.name "quant-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase || true
          git add -A
          if git diff --staged --quiet; then
            echo "no changes"
          else
            git commit -m "brief $(TZ=Asia/Seoul date +%Y-%m-%d)"
            git push
          fi
